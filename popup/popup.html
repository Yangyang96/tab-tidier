<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="popup.css">
  <title>Tab Tidier</title>
</head>
<body>
  <div class="container">
    <button id="tidy-btn" class="tidy-btn">Tidy All Tabs</button>
    <div id="stats" class="stats" aria-live="polite"></div>
    <input id="search" type="search" placeholder="Search titles or URLs" aria-label="Search tabs">
    <div id="status" class="status" role="status"></div>
    <div id="tab-list" class="tab-list"></div>
  </div>
  <script src="tab-utils.js"></script>
  <script src="popup.js"></script>
</body>
</html>
